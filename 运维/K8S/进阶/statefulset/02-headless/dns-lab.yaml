# ============================================================
# 第二课：Headless Service 与稳定网络身份
# ------------------------------------------------------------
# 核心认知：
#   StatefulSet 的"稳定"来自两个稳定：
#     1) 稳定网络标识  —— Pod 名 + Headless Service 域名
#     2) 稳定存储标识  —— volumeClaimTemplates 生成的 PVC 名
#   Pod IP 是会变的，但上面两个不变。
#
# DNS 记录形态（ns=default）：
#   nginx-sts-0.nginx-sts.default.svc.cluster.local   ← A 记录，单个 Pod
#   nginx-sts.default.svc.cluster.local                ← 所有 Ready Pod 的 A 记录集合
#
# 注意：
#   - 只有 Ready 的 Pod 才会进入 Headless Service 的 Endpoints
#     （有 publishNotReadyAddresses: true 时例外）
#   - 有状态集群（Kafka/ZK/ETCD）正是依赖"每个成员有固定地址"来组建集群
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: nginx-sts
  labels:
    app: nginx-sts
spec:
  clusterIP: None
  selector:
    app: nginx-sts
  ports:
    - name: http
      port: 80
      targetPort: 80
  # 关键开关：让未就绪的 Pod 也出现在 DNS/Endpoints 中
  # 场景：集群启动时各成员需要互相发现才能"一起"就绪
  #      （如 etcd 组建 quorum、ZooKeeper 选主）
  # 副作用：客户端可能连到还没准备好的 Pod，需自行处理重试
  publishNotReadyAddresses: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-sts
spec:
  serviceName: nginx-sts
  replicas: 3
  selector:
    matchLabels:
      app: nginx-sts
  template:
    metadata:
      labels:
        app: nginx-sts
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
---
# ------------------------------------------------------------
# 验证用的客户端 Pod：交互式测试 DNS
#   kubectl exec -it dns-client -- sh
#   # 完整域名（FQDN）
#   nslookup nginx-sts-0.nginx-sts.default.svc.cluster.local
#   # 短域名（同命名空间下 Service 名）
#   nslookup nginx-sts
#   # 在 Pod 内部用短名访问同 StatefulSet 的兄弟节点
#   wget -qO- http://nginx-sts-1.nginx-sts:80
# ------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: dns-client
spec:
  containers:
    - name: client
      image: busybox:1.36
      command: ["sleep", "infinity"]