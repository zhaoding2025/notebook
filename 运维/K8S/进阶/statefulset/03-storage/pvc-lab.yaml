# ============================================================
# 第三课附录：持久化实验（验证 PVC 与序号的绑定）
# ------------------------------------------------------------
# 用一个"写磁盘 + 上报序号"的极简容器，专注观察存储行为。
#
# 实验脚本（照着敲一遍，收获最大）：
#
#   kubectl apply -f pvc-lab.yaml
#   kubectl get pvc -l app=store          # data-store-0/1/2 各 1Gi
#
#   # ① 写入身份数据
#   for i in 0 1 2; do
#     kubectl exec store-$i -- sh -c "echo pod-$i-\$(date +%s) > /data/id"
#   done
#
#   # ② 删掉 1 号 Pod，观察它重回时数据是否还在
#   kubectl delete pod store-1
#   kubectl wait --for=condition=Ready pod/store-1 --timeout=120s
#   kubectl exec store-1 -- cat /data/id     # ← 原数据仍在
#
#   # ③ 缩容到 1，再扩回 3
#   kubectl scale sts store --replicas=1
#   kubectl get pvc -l app=store             # PVC 全部保留（不会被回收）
#   kubectl scale sts store --replicas=3
#   kubectl exec store-2 -- cat /data/id     # ← 2 号数据也还在
#
#   # ④ 彻底清理（注意：删 STS 不会删 PVC，必须手动删）
#   kubectl delete sts store --cascade=orphan=false
#   kubectl get pvc                          # 仍然存在！
#   kubectl delete pvc -l app=store
#
# 结论：StatefulSet 把"身份的持久化"交给了 PVC 命名规则 + 序号绑定。
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: store
spec:
  clusterIP: None
  selector:
    app: store
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store
spec:
  serviceName: store
  replicas: 3
  selector:
    matchLabels:
      app: store
  # 演示：缩容/删除时的 PVC 回收策略（K8s v1.27 GA）
  persistentVolumeClaimRetentionPolicy:
    whenScaled: Retain        # 缩容时保留 PVC（默认）
    whenDeleted: Retain       # 删 STS 时保留 PVC（默认）
    # 若设为 Delete，则缩容/删除时自动清理，适合"纯缓存"型服务
  template:
    metadata:
      labels:
        app: store
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              set -e
              echo "[$(date -Iseconds)] boot $(hostname)" >> /data/boot.log
              # 每次启动自增启动计数，直观展示"数据跨 Pod 生命周期存活"
              COUNT=$(cat /data/count 2>/dev/null || echo 0)
              echo $((COUNT+1)) > /data/count
              echo "$(hostname) boot count = $((COUNT+1))"
              # 简单 HTTP 服务，方便 curl 读取 /data
              while true; do
                printf 'HTTP/1.0 200 OK\r\n\r\n%s\nhello from %s\ncount=%s\n' \
                  "$(cat /data/boot.log)" "$(hostname)" "$(cat /data/count)" \
                  | nc -l -p 8080
              done
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app: store
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi