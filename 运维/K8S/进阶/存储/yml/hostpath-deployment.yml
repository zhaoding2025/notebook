apiVersion: apps/v1
kind: Deployment
metadata:
  name: hostpath-deployment
  namespace: test
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      annotations:
        update: 2026-0428
      labels:
        app: nginx
    spec:
      volumes:
      - name: config
        configMap:
          name: nginx-config
      - name: html
        hostPath:
          path: /html
          type: DirectoryOrCreate
      containers:
      - name: nginx
        image: nginx:1.27.0
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/conf.d/
        - name: html
          mountPath: /usr/share/nginx/html