apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-deployment
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-6379
  template:
    metadata:
      labels:
        app: redis-6379
    spec:
      containers:
      - name: redis
        image: redis:6.0
        ports:
        - containerPort: 6379
        livenessProbe:
        #readinessProbe:
          exec:
            command: ['/bin/sh', '-c', 'redis-cli info']
          initialDelaySeconds: 10
          periodSeconds: 3
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: demo
spec:
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  selector:
    app: redis-6379