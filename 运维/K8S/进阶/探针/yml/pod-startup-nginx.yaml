# apiVersion：api文档版本
apiVersion: v1
# kind：资源对象类型，也可以配置为像Deployment、StatefulSet这一类的对象
kind: Pod
# metadata：Pod相关的元数据，用于描述Pod的数据
metadata:
  name: nginx-demo # Pod的名称
  labels: # 定义Pod的标签
    type: app # 自定义label标签，名字为type，值为app
    test: 1.0.0 # 自定义label标签，描述Pod版本号
  namespace: default # 命名空间的配置
# spec：期望Pod按照这里面的描述进行创建
spec:
  restartPolicy: OnFailure # 重启策略，只有失败的情况才会重启
  containers: # 对于Pod中的容器描述
    - name: nginx # 容器的名称
      image: nginx:1.7.9 # 指定容器的镜像
      imagePullPolicy: IfNotPresent # 镜像拉取策略，指定如果本地有就用本地的，如果没有就拉取远程的
      startupProbe: # 应用启动探针配置
        httpGet: # 探测方式，基于http请求探测
#         path: /api/path # http请求路径，无此路径探针会失败
          path: /index.html # http请求路径
          port: 80 # 请求端口
        failureThreshold: 3 # 失败多少次才算真正失败
        periodSeconds: 10 # 间隔时间
        successThreshold: 1 # 多少次监测成功算成功
        timeoutSeconds: 5 # 请求的超时时间
      command: # 指定容器启动时执行的命令
        - nginx
        - -g
        - 'daemon off;' # nginx -g 'daemon off;'
      workingDir: /usr/share/nginx/html # 定义容器启动后的工作目录
      ports: # 端口名称
        - name: http
          containerPort: 80 # 描述容器内要暴露什么端口
          protocol: TCP # 描述该端口是基于哪种协议通信的
      env: # 环境变量
        - name: JVM_OPTS # 环境变量名称
          value: '-Xms128m -Xmx128m' # 环境变量的值
      resources:
        requests: # 最少需要多少资源
          cpu: 100m # 限制cpu最少使用0.1个核心
          memory: 128Mi # 限制内存最少使用128兆
        limits: # 最多可以用多少资源
          cpu: 200m # 限制cpu最多使用0.2个核心
          memory: 256Mi # 限制最多使用256兆